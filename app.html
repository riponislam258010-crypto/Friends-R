<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frends</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f0f2f5}
.top{background:#1877f2;color:#fff;padding:12px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.top small{display:block;font-size:12px;font-weight:normal}
.box{background:#fff;margin:10px;padding:12px;border-radius:12px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}
button{background:#1877f2;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold}
button:active{opacity:.8}
.post{background:#fff;margin:10px;padding:12px;border-radius:12px}
.post img{width:100%;border-radius:10px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{background:#eef2ff;color:#1877f2;flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ddd;padding:6px 0}
.nav button{background:none;color:#333;flex:1;font-size:12px}
.nav button.active{color:#1877f2}
.page{padding-bottom:70px;display:none}.page.show{display:block}
video{width:100%;border-radius:10px}
.chatmsg{background:#e7f3ff;padding:8px 10px;border-radius:10px;margin:5px 0}
</style>
</head>
<body>
<div class="top">Frends<small>Ripon Islam</small></div>

<!-- HOME -->
<div id="home" class="page show">
<div class="box">
<textarea id="postText" placeholder="তোমার মনে কি? লিখো..."></textarea>
<input id="postImg" placeholder="ছবির লিংক থাকলে দাও (না দিলেও হবে)">
<button onclick="addPost()" style="width:100%">পোস্ট করুন ✅</button>
<p id="msg" style="color:green;text-align:center"></p>
</div>
<div id="feed"></div>
</div>

<!-- VIDEO -->
<div id="video" class="page">
<div class="box"><h3>🎬 ভিডিও</h3><p>ভিডিওতে চাপ দিলে চলবে</p>
<video controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video><br><br>
<video controls src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
</div>
</div>

<!-- REELS -->
<div id="reels" class="page">
<div class="box"><h3>🎞️ রিলস</h3><video controls src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video></div>
</div>

<!-- PHOTO -->
<div id="photo" class="page">
<div class="box"><h3>🖼️ ফটো</h3>
<img style="width:100%;border-radius:10px" onclick="alert('ছবি খুলছে!')" src="https://picsum.photos/600/400?1">
<br><br>
<img style="width:100%;border-radius:10px" onclick="alert('ছবি খুলছে!')" src="https://picsum.photos/600/400?2">
</div>
</div>

<!-- SMS -->
<div id="sms" class="page">
<div class="box"><h3>💬 SMS / চ্যাট</h3><div id="chatBox"><div class="chatmsg">👋 হাই রিপন! তোমার অ্যাপটা সুন্দর হইছে</div></div>
<input id="chatInput" placeholder="মেসেজ লিখো..."><button onclick="sendChat()" style="width:100%">পাঠাও</button></div>
</div>

<!-- CALL -->
<div id="call" class="page">
<div class="box" style="text-align:center"><h3>📞 কল</h3><p>বন্ধুর নাম: রাকিব</p><button onclick="alert('কল যাচ্ছে... 📞 (ডেমো)')">📞 কল দাও</button><br><br><button onclick="alert('ভিডিও কল যাচ্ছে... 🎥 (ডেমো)')" style="background:#00a400">🎥 ভিডিও কল</button></div>
</div>

<div class="nav">
<button class="active" onclick="show('home',this)">🏠<br>হোম</button>
<button onclick="show('video',this)">🎬<br>ভিডিও</button>
<button onclick="show('reels',this)">🎞️<br>রিলস</button>
<button onclick="show('photo',this)">🖼️<br>ফটো</button>
<button onclick="show('sms',this)">💬<br>SMS</button>
<button onclick="show('call',this)">📞<br>কল</button>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('frends_posts')||'[]');
if(posts.length==0){posts=[{text:'স্বাগতম Frends এ! 🎉 এখন পোস্ট করলে এখানে দেখা যাবে।',img:'',likes:5,comments:['সুন্দর হইছে!']}];}
function render(){
let h='';
posts.forEach((p,i)=>{
h+=`<div class="post"><b>Ripon Islam</b><p>${p.text}</p>${p.img?`<img src="${p.img}">`:''}<div class="actions"><button onclick="like(${i})">❤️ লাইক (${p.likes})</button><button onclick="comment(${i})">💬 কমেন্ট (${p.comments.length})</button></div><div>${p.comments.map(c=>'<div style="background:#f0f2f5;padding:6px;border-radius:8px;margin-top:5px">💬 '+c+'</div>').join('')}</div></div>`;
});
document.getElementById('feed').innerHTML=h;
}
function addPost(){
let t=document.getElementById('postText').value.trim();
if(!t){alert('আগে কিছু লিখো!');return;}
posts.unshift({text:t,img:document.getElementById('postImg').value,likes:0,comments:[]});
localStorage.setItem('frends_posts',JSON.stringify(posts));
document.getElementById('postText').value='';document.getElementById('postImg').value='';
document.getElementById('msg').innerText='পোস্ট হয়ে গেছে ✅';render();
}
function like(i){posts[i].likes++;localStorage.setItem('frends_posts',JSON.stringify(posts));render();}
function comment(i){let c=prompt('কমেন্ট লিখো:');if(c){posts[i].comments.push(c);localStorage.setItem('frends_posts',JSON.stringify(posts));render();}}
function sendChat(){let v=document.getElementById('chatInput').value.trim();if(!v)return;document.getElementById('chatBox').innerHTML+=`<div class="chatmsg" style="background:#d9fdd3;text-align:right">তুমি: ${v}</div>`;document.getElementById('chatInput').value='';setTimeout(()=>{document.getElementById('chatBox').innerHTML+=`<div class="chatmsg">বন্ধু: হ্যাঁ বুঝছি 😊</div>`},800);}
function show(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
render();
</script>
</body>
</html>
